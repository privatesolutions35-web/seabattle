<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской бой</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2.5em; text-shadow: 0 0 20px rgba(0, 150, 255, 0.5); }
        .mode-select { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .mode-btn {
            padding: 15px 40px; font-size: 1.2em; border: 2px solid #00d4ff;
            background: transparent; color: #00d4ff; cursor: pointer;
            border-radius: 10px; transition: all 0.3s;
        }
        .mode-btn:hover, .mode-btn.active {
            background: #00d4ff; color: #1a1a2e; box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }
        .game-area { display: none; gap: 50px; justify-content: center; flex-wrap: wrap; }
        .game-area.active { display: flex; }
        .board-container { text-align: center; }
        .board-title { font-size: 1.3em; margin-bottom: 15px; color: #00d4ff; }
        .board {
            display: grid; grid-template-columns: repeat(10, 35px); grid-template-rows: repeat(10, 35px);
            gap: 2px; background: rgba(0, 212, 255, 0.2); padding: 5px; border-radius: 10px;
        }
        .cell {
            width: 35px; height: 35px; background: rgba(0, 50, 100, 0.5);
            border: 1px solid rgba(0, 150, 255, 0.3); cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .cell:hover:not(.hit):not(.miss):not(.ship-placed) { background: rgba(0, 150, 255, 0.3); }
        .cell.ship { background: rgba(100, 100, 100, 0.5); }
        .cell.hit { background: #ff4444; cursor: not-allowed; }
        .cell.miss { background: #444; cursor: not-allowed; }
        .cell.hit::after { content: "✕"; }
        .cell.miss::after { content: "•"; color: #00d4ff; }
        .cell.ship-hit { background: #ff0000; }
        .status { text-align: center; font-size: 1.5em; margin: 20px 0; padding: 15px; background: rgba(0, 212, 255, 0.1); border-radius: 10px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .btn {
            padding: 12px 30px; font-size: 1em; border: none;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #1a1a2e; cursor: pointer; border-radius: 8px; transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .ship-selector { display: none; text-align: center; margin: 20px 0; }
        .ship-selector.active { display: block; }
        .ship-btn {
            padding: 10px 20px; margin: 5px; border: 2px solid #00d4ff;
            background: transparent; color: #00d4ff; cursor: pointer; border-radius: 5px; font-size: 0.9em;
        }
        .ship-btn.selected { background: #00d4ff; color: #1a1a2e; }
        .lobby { display: none; text-align: center; padding: 30px; }
        .lobby.active { display: block; }
        .lobby input {
            padding: 10px 20px; font-size: 1em; border: 2px solid #00d4ff;
            background: transparent; color: #fff; border-radius: 5px; margin: 5px;
        }
        .room-code { font-size: 2em; color: #00d4ff; margin: 20px 0; }
        .waiting { font-size: 1.2em; color: #888; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .winner { animation: fadeIn 0.5s; color: #00ff88; font-size: 2em; }
        .player-num { color: #00ff88; }
        .sound-btn {
            background: transparent; border: 2px solid #00d4ff; border-radius: 50%;
            width: 40px; height: 40px; font-size: 1.2em; cursor: pointer; margin-left: 20px;
            transition: all 0.3s;
        }
        .sound-btn:hover { background: rgba(0, 212, 255, 0.3); }
        .sound-btn.music-off { border-color: #ffaa00; }
        .sound-btn.all-off { border-color: #ff4444; }
        .popup {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .popup-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 40px; border-radius: 20px;
            text-align: center; border: 2px solid #00d4ff; box-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
        }
        .popup-content h2 { font-size: 3em; margin-bottom: 20px; }
        .popup-content p { font-size: 1.5em; margin-bottom: 30px; }
        .room-list { margin: 20px 0; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        .room-item {
            padding: 10px; margin: 5px 0; background: rgba(0, 212, 255, 0.1);
            border-radius: 5px; display: flex; justify-content: space-between; align-items: center;
        }
        .room-item button { padding: 5px 15px; font-size: 0.9em; }
        .setup-area { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
        .setup-controls { text-align: center; }
        .timer { text-align: center; font-size: 1.3em; color: #ff6b6b; margin: 10px 0; padding: 10px; background: rgba(255, 107, 107, 0.1); border-radius: 10px; }
        .timer.warning { color: #ff0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚢 Sea Battle <span id="onlineCount" style="font-size: 0.5em; color: #00ff88;">Online: 0</span> <button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔊</button></h1>
        <div class="mode-select">
            <button class="mode-btn" id="btnBot" onclick="selectMode('bot')">vs Bot</button>
            <button class="mode-btn" id="btnMulti" onclick="selectMode('multi')">Multiplayer</button>
        </div>
        <div id="status" class="status">Select game mode</div>
        <div id="timer" class="timer" style="display:none">Time left: <span id="timerValue">45</span>s</div>
        
        <div id="setup" class="ship-selector">
            <h3>Place your ships</h3>
            <div class="setup-area">
                <div class="board-container">
                    <div class="board-title">Your board</div>
                    <div class="board" id="playerBoard"></div>
                </div>
                <div class="setup-controls">
                    <div class="controls">
                        <button class="ship-btn" data-size="4" onclick="selectShipSize(4)">🚢(4)</button>
                        <button class="ship-btn" data-size="3" onclick="selectShipSize(3)">🚤(3)</button>
                        <button class="ship-btn" data-size="3" onclick="selectShipSize(3)">🚤(3)</button>
                        <button class="ship-btn" data-size="2" onclick="selectShipSize(2)">🛥️(2)</button>
                        <button class="ship-btn" data-size="2" onclick="selectShipSize(2)">🛥️(2)</button>
                        <button class="ship-btn" data-size="2" onclick="selectShipSize(2)">🛥️(2)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">⚓(1)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">⚓(1)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">⚓(1)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">⚓(1)</button>
                    </div>
                    <div class="controls">
                        <button class="btn" onclick="rotateShip()">Rotate (horizontal)</button>
                        <button class="btn" onclick="randomPlace()">Random</button>
                        <button class="btn" onclick="clearBoard()">Clear</button>
                    </div>
                    <button class="btn" id="startGameBtn" onclick="startGame()">Start Game</button>
                </div>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="board-container">
                <div class="board-title">Your fleet <span id="playerLabel"></span></div>
                <div class="board" id="playerBoardGame"></div>
            </div>
            <div class="board-container">
                <div class="board-title">Enemy fleet</div>
                <div class="board" id="enemyBoard"></div>
            </div>
            <div class="controls" id="surrenderArea" style="display:none">
                <button class="btn" onclick="surrender()">Surrender</button>
            </div>
        </div>

        <div class="lobby" id="lobby">
            <h3>Multiplayer</h3>
            <div class="controls">
                <button class="btn" onclick="createRoom()">Create Room</button>
                <button class="btn" onclick="refreshRooms()">Refresh</button>
            </div>
            <h4>Available rooms:</h4>
            <div class="room-list" id="roomList">
                <div class="waiting">Loading...</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="restartBtn" onclick="restartGame()" style="display:none">New Game</button>
        </div>
        
        <div id="gameOverPopup" class="popup">
            <div class="popup-content">
                <h2 id="gameOverTitle">VICTORY!</h2>
                <p id="gameOverMessage">You won!</p>
                <div class="controls">
                    <button class="btn" onclick="restartGame()">Play Again</button>
                    <button class="btn" onclick="location.reload()">Main Menu</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const BOARD_SIZE = 10;
        let playerBoard = [], enemyBoard = [];
        let playerShips = [], enemyShips = [];
        let currentShipSize = 4, isHorizontal = true;
        let gameMode = '', placedShips = [];
        let ws = null, playerId = null, roomCode = null, playerNum = 0;
        let myTurn = true, multiEnemyShips = [];
        let setupTimer = null;
        let setupTimeLeft = 45;
        let turnTimer = null;
        let turnTimeLeft = 10;
        let opponentShips = [];
        
        let soundState = 0; // 0 = all on, 1 = music off, 2 = all off
        let bgMusic = new Audio('/audio/Crescent-Moon(chosic.com).mp3');
        let shootSound = new Audio('/audio/shooting-an-optical-sight-on-a-rifle.mp3');
        let missSound = new Audio('/audio/ebf3f2b0fc87877.mp3');
        let hitSound = new Audio('/audio/deafening-close-explosion.mp3');
        let winSound = new Audio('/audio/c0a42ebbc6835a6.mp3');
        let loseSound = new Audio('/audio/defeat.mp3');
        
        bgMusic.loop = true;
        bgMusic.volume = 0.5;
        bgMusic.preload = 'auto';
        
        winSound.preload = 'auto';
        loseSound.preload = 'auto';
        shootSound.preload = 'auto';
        hitSound.preload = 'auto';
        missSound.preload = 'auto';
        
        function playSound(sound) {
            if (soundState >= 2) return;
            if (sound) {
                sound.currentTime = 0;
                const playPromise = sound.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log('Sound error:', e.message));
                }
            }
        }
        
        function toggleSound() {
            soundState = (soundState + 1) % 3;
            const btn = document.getElementById('soundToggle');
            btn.classList.remove('music-off', 'all-off');
            if (soundState === 0) {
                btn.textContent = '🔊';
                if (!bgMusic.paused) bgMusic.play().catch(() => {});
            } else if (soundState === 1) {
                btn.textContent = '🎵';
                btn.classList.add('music-off');
                bgMusic.pause();
            } else {
                btn.textContent = '🔇';
                btn.classList.add('all-off');
                bgMusic.pause();
            }
        }
        
        function setGameMusicVolume(inGame) {
            if (soundState === 0) {
                bgMusic.volume = inGame ? 0.25 : 0.5;
                if (!bgMusic.paused) bgMusic.play().catch(() => {});
            }
        }

        function connectWS(callback) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (callback) callback();
                return;
            }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'getOnline' }));
                document.getElementById('status').textContent = 'Connected. Select game mode';
                if (callback) callback();
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'start' || msg.type === 'nextTurn') {
                    console.log('WS message:', msg.type, 'playerId:', playerId, 'msg.playerId:', msg.currentPlayer || msg.playerId);
                }
                handleWSMessage(msg);
            };
            ws.onerror = (e) => {
                console.log('WebSocket error:', e);
            };
        }

        function handleWSMessage(msg) {
            switch (msg.type) {
                case 'onlineCount':
                    document.getElementById('onlineCount').textContent = `Игроков онлайн: ${msg.count}`;
                    break;
                case 'roomsList':
                    renderRoomList(msg.rooms);
                    break;
                case 'created':
                    roomCode = msg.roomCode;
                    playerId = msg.playerId;
                    playerNum = 1;
                    document.getElementById('status').textContent = `Room created: ${roomCode}. Waiting for player...`;
                    break;
                case 'joined':
                    roomCode = msg.roomCode;
                    playerId = msg.playerId;
                    playerNum = 2;
                    document.getElementById('status').textContent = 'You joined the room';
                    startMultiSetup();
                    break;
                case 'playerJoined':
                    document.getElementById('status').textContent = 'Player joined! Place your ships';
                    startMultiSetup();
                    break;
                case 'playerReady':
                    document.getElementById('status').textContent = 'Opponent placing ships...';
                    break;
                case 'start':
                    myTurn = String(msg.currentPlayer) === String(playerId);
                    opponentShips = msg.opponentShips || [];
                    document.getElementById('setup').classList.remove('active');
                    document.getElementById('gameArea').classList.add('active');
                    document.getElementById('lobby').classList.remove('active');
                    if (gameMode === 'multi') {
                        document.getElementById('surrenderArea').style.display = 'flex';
                    }
                    document.getElementById('playerLabel').innerHTML = playerNum === 1 ? '(Игрок 1)' : '(Игрок 2)';
                    enemyBoard = initBoard();
                    renderBoard(playerBoard, 'playerBoardGame', placedShips, true);
                    renderBoard(enemyBoard, 'enemyBoard', opponentShips, false);
                    if (myTurn) startTurnTimer();
                    else stopTurnTimer();
                    updateTurnStatus();
                    break;
                case 'shotResult':
                    if (String(msg.playerId) === String(playerId)) {
                        enemyBoard[msg.row][msg.col] = msg.result === 'hit' || msg.result === 'sunk' ? 2 : 1;
                        renderBoard(enemyBoard, 'enemyBoard', opponentShips, false);
                        setTimeout(() => playSound(msg.result === 'hit' || msg.result === 'sunk' ? hitSound : missSound), 200);
                        if (msg.result === 'miss') {
                            stopTurnTimer();
                        }
                    } else {
                        playerBoard[msg.row][msg.col] = msg.result === 'hit' || msg.result === 'sunk' ? 2 : 1;
                        renderBoard(playerBoard, 'playerBoardGame', placedShips, true);
                        setTimeout(() => playSound(msg.result === 'hit' || msg.result === 'sunk' ? hitSound : missSound), 200);
                    }
                    break;
                case 'nextTurn':
                    myTurn = String(msg.playerId) === String(playerId);
                    updateTurnStatus();
                    if (myTurn) startTurnTimer();
                    else stopTurnTimer();
                    break;
                case 'gameOver':
                    stopTurnTimer();
                    const won = String(msg.winner) === String(playerId);
                    setTimeout(() => showGameOverPopup(won), 500);
                    break;
                    break;
                case 'opponentLeft':
                    alert('Противчик вышел из игры');
                    location.reload();
                    break;
                case 'error':
                    alert(msg.message);
                    break;
            }
        }

        function renderRoomList(rooms) {
            const list = document.getElementById('roomList');
            if (!rooms || rooms.length === 0) {
                list.innerHTML = '<div class="waiting">No available rooms</div>';
                return;
            }
            list.innerHTML = rooms.map(r => `
                <div class="room-item">
                    <span>Комната: ${r.code} (${r.players}/2 игроков)</span>
                    <button class="btn" onclick="joinRoom('${r.code}')">Войти</button>
                </div>
            `).join('');
        }

        function updateTurnStatus() {
            document.getElementById('status').textContent = myTurn ? 'Your turn' : 'Opponent turn';
        }

        function initBoard() { return Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0)); }

        function renderBoard(board, elementId, ships = [], showShips = false) {
            const boardEl = document.getElementById(elementId);
            boardEl.innerHTML = '';
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    const ship = ships.find(s => i >= s.row && i < s.row + s.size && j >= s.col && j < s.col + s.size);
                    if (showShips && ship) cell.classList.add('ship');
                    if (board[i][j] === 1) cell.classList.add('miss');
                    if (board[i][j] === 2) cell.classList.add('hit');
                    if (board[i][j] === 3 && showShips) cell.classList.add('ship-hit');
                    if (elementId === 'enemyBoard') {
                        if (gameMode === 'multi' && myTurn) {
                            cell.onclick = () => multiShoot(i, j);
                        } else if (gameMode === 'bot') {
                            cell.onclick = () => playerShoot(i, j);
                        }
                    }
                    boardEl.appendChild(cell);
                }
            }
        }

        function selectMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('setup').classList.remove('active');
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('lobby').classList.remove('active');
            document.getElementById('status').textContent = 'Select game mode';
            
            if (mode === 'bot') {
                document.getElementById('setup').classList.add('active');
                initSetupBoard();
            } else {
                document.getElementById('lobby').classList.add('active');
                connectWS(refreshRooms);
            }
        }

        function initSetupBoard() {
            playerBoard = initBoard();
            placedShips = [];
            document.querySelectorAll('.ship-btn').forEach(b => { b.classList.remove('placed'); b.style.display = 'inline-block'; });
            currentShipSize = 4;
            selectShipSize(4);
            renderPlayerSetup();
            startSetupTimer();
            if (soundState === 0) {
                bgMusic.volume = 0.5;
                bgMusic.play().catch(() => {});
            }
        }

        function startSetupTimer() {
            stopSetupTimer();
            setupTimeLeft = 45;
            const timerEl = document.getElementById('timer');
            const timerValue = document.getElementById('timerValue');
            timerEl.style.display = 'block';
            timerValue.textContent = setupTimeLeft;
            timerEl.classList.remove('warning');
            
            setupTimer = setInterval(() => {
                setupTimeLeft--;
                timerValue.textContent = setupTimeLeft;
                
                if (setupTimeLeft <= 10) {
                    timerEl.classList.add('warning');
                }
                
                if (setupTimeLeft <= 0) {
                    stopSetupTimer();
                    if (placedShips.length < 10) {
                        randomPlace();
                        document.getElementById('status').textContent = 'Time up! Ships placed randomly';
                        setTimeout(() => {
                            startGame();
                        }, 1000);
                    }
                }
            }, 1000);
        }

        function stopSetupTimer() {
            if (setupTimer) {
                clearInterval(setupTimer);
                setupTimer = null;
            }
            document.getElementById('timer').style.display = 'none';
            document.getElementById('timer').classList.remove('warning');
        }

        function startTurnTimer() {
            if (turnTimer) return;
            turnTimeLeft = 10;
            const timerEl = document.getElementById('timer');
            const timerValue = document.getElementById('timerValue');
            timerEl.style.display = 'block';
            timerValue.textContent = turnTimeLeft;
            timerEl.classList.remove('warning');
            
            turnTimer = setInterval(() => {
                turnTimeLeft--;
                timerValue.textContent = turnTimeLeft;
                
                if (turnTimeLeft <= 3) {
                    timerEl.classList.add('warning');
                }
                
                if (turnTimeLeft <= 0) {
                    stopTurnTimer();
                    if (myTurn && gameMode === 'multi') {
                        makeRandomShot();
                    }
                }
            }, 1000);
        }

        function stopTurnTimer() {
            if (turnTimer) {
                clearInterval(turnTimer);
                turnTimer = null;
            }
        }

        function makeRandomShot() {
            console.log('makeRandomShot called, myTurn:', myTurn, 'enemyBoard:', enemyBoard);
            let row, col;
            do {
                row = Math.floor(Math.random() * BOARD_SIZE);
                col = Math.floor(Math.random() * BOARD_SIZE);
            } while (enemyBoard[row][col] === 1 || enemyBoard[row][col] === 2);
            console.log('Random shot:', row, col);
            multiShoot(row, col);
        }

        function surrender() {
            if (confirm('Вы уверены, что хотите сдаться?')) {
                ws.send(JSON.stringify({ type: 'surrender' }));
                showGameOverPopup(false);
                bgMusic.pause();
            }
        }

        function resetTurnTimer() {
            if (myTurn) {
                startTurnTimer();
            }
        }

        function renderPlayerSetup() {
            const boardEl = document.getElementById('playerBoard');
            boardEl.innerHTML = '';
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    if (playerBoard[i][j] === 3) cell.classList.add('ship');
                    cell.onclick = () => placeShip(i, j);
                    boardEl.appendChild(cell);
                }
            }
        }

        function selectShipSize(size) {
            currentShipSize = size;
            document.querySelectorAll('.ship-btn').forEach(b => b.classList.remove('selected'));
            document.querySelector(`.ship-btn[data-size="${size}"]:not(.placed)`)?.classList.add('selected');
        }

        function rotateShip() {
            isHorizontal = !isHorizontal;
            document.querySelector('.btn[onclick="rotateShip()"]').textContent = `Повернуть (${isHorizontal ? 'горизонтально' : 'вертикально'})`;
        }

        function placeShip(row, col) {
            if (canPlaceShip(row, col, currentShipSize, isHorizontal)) {
                for (let i = 0; i < currentShipSize; i++) {
                    const r = isHorizontal ? row : row + i;
                    const c = isHorizontal ? col + i : col;
                    playerBoard[r][c] = 3;
                }
                placedShips.push({ row, col, size: currentShipSize, horizontal: isHorizontal });
                renderPlayerSetup();
                hidePlacedShip();
            }
        }

        function hidePlacedShip() {
            const btns = document.querySelectorAll('.ship-btn:not(.placed)');
            if (btns.length > 0) {
                btns[0].classList.add('placed');
                btns[0].style.display = 'none';
                if (btns[1]) selectShipSize(parseInt(btns[1].dataset.size));
            }
        }

        function canPlaceShip(row, col, size, horizontal) {
            for (let i = 0; i < size; i++) {
                const r = horizontal ? row : row + i;
                const c = horizontal ? col + i : col;
                if (r >= BOARD_SIZE || c >= BOARD_SIZE) return false;
                if (playerBoard[r][c] !== 0) return false;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            if (playerBoard[nr][nc] !== 0 && playerBoard[nr][nc] !== 3) return false;
                        }
                    }
                }
            }
            return true;
        }

        function randomPlace() {
            playerBoard = initBoard();
            placedShips = [];
            const ships = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
            for (const size of ships) {
                let placed = false;
                while (!placed) {
                    const horizontal = Math.random() > 0.5;
                    const row = Math.floor(Math.random() * BOARD_SIZE);
                    const col = Math.floor(Math.random() * BOARD_SIZE);
                    if (canPlaceOnBoard(row, col, size, horizontal, playerBoard)) {
                        for (let i = 0; i < size; i++) {
                            const r = horizontal ? row : row + i;
                            const c = horizontal ? col + i : col;
                            playerBoard[r][c] = 3;
                        }
                        placedShips.push({ row, col, size, horizontal });
                        placed = true;
                    }
                }
            }
            document.querySelectorAll('.ship-btn').forEach(b => { b.classList.add('placed'); b.style.display = 'none'; });
            renderPlayerSetup();
        }

        function clearBoard() {
            initSetupBoard();
        }

        function canPlaceOnBoard(row, col, size, horizontal, board) {
            for (let i = 0; i < size; i++) {
                const r = horizontal ? row : row + i;
                const c = horizontal ? col + i : col;
                if (r >= BOARD_SIZE || c >= BOARD_SIZE) return false;
                if (board[r][c] !== 0) return false;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            if (board[nr][nc] !== 0) return false;
                        }
                    }
                }
            }
            return true;
        }

        function startGame() {
            if (placedShips.length < 10) { alert('Place all ships!'); return; }
            stopSetupTimer();
            if (gameMode === 'bot') startBotGame();
            else sendReady();
        }

        function startBotGame() {
            stopSetupTimer();
            document.getElementById('setup').classList.remove('active');
            document.getElementById('gameArea').classList.add('active');
            enemyBoard = initBoard();
            placeEnemyShips();
            document.getElementById('status').textContent = 'Your turn';
            renderBoard(playerBoard, 'playerBoardGame', placedShips, true);
            renderBoard(enemyBoard, 'enemyBoard', enemyShips, false);
            
            if (soundState === 0) {
                bgMusic.volume = 0.25;
            }
            
            // Добавляем обработчики клика для стрельбы в режиме бота
            const enemyCells = document.querySelectorAll('#enemyBoard .cell');
            enemyCells.forEach(cell => {
                cell.onclick = () => {
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    playerShoot(row, col);
                };
            });
        }

        function startMultiSetup() {
            document.getElementById('lobby').classList.remove('active');
            document.getElementById('setup').classList.add('active');
            initSetupBoard();
            document.getElementById('startGameBtn').textContent = 'Ready!';
            document.getElementById('status').textContent = `Place your ships (Player ${playerNum})`;
        }

        function sendReady() {
            ws.send(JSON.stringify({ type: 'ready', board: playerBoard, ships: placedShips }));
            document.getElementById('status').textContent = 'Waiting for opponent...';
            document.getElementById('startGameBtn').disabled = true;
        }

        function multiShoot(row, col) {
            console.log('multiShoot called - playerId:', playerId, 'roomCode:', roomCode, 'myTurn:', myTurn, 'gameMode:', gameMode);
            console.log('enemyBoard value:', enemyBoard[row][col]);
            if (!myTurn) { 
                document.getElementById('status').textContent = 'Not your turn!';
                return; 
            }
            if (enemyBoard[row][col] === 1 || enemyBoard[row][col] === 2) { 
                document.getElementById('status').textContent = 'Already shot here!';
                return; 
            }
            playSound(shootSound);
            ws.send(JSON.stringify({ type: 'shoot', row, col }));
        }

        function placeEnemyShips() {
            enemyShips = [];
            const ships = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
            for (const size of ships) {
                let placed = false;
                while (!placed) {
                    const horizontal = Math.random() > 0.5;
                    const row = Math.floor(Math.random() * BOARD_SIZE);
                    const col = Math.floor(Math.random() * BOARD_SIZE);
                    if (canPlaceOnBoard(row, col, size, horizontal, enemyBoard)) {
                        for (let i = 0; i < size; i++) {
                            const r = horizontal ? row : row + i;
                            const c = horizontal ? col + i : col;
                            enemyBoard[r][c] = 3;
                        }
                        enemyShips.push({ row, col, size, horizontal });
                        placed = true;
                    }
                }
            }
        }

        function playerShoot(row, col) {
            if (enemyBoard[row][col] === 1 || enemyBoard[row][col] === 2) return;
            playSound(shootSound);
            if (enemyBoard[row][col] === 3) {
                enemyBoard[row][col] = 2;
                const hits = getShipCount(enemyBoard, enemyShips);
                document.getElementById('status').textContent = 'Hit! Shoot again';
                setTimeout(() => playSound(hitSound), 200);
                if (hits >= 20) {
                    document.getElementById('status').innerHTML = '<span class="winner">ПОБЕДА! 🎉</span>';
                    setTimeout(() => showGameOverPopup(true), 500);
                }
            } else {
                enemyBoard[row][col] = 1;
                document.getElementById('status').textContent = 'Miss. Opponent turn';
                setTimeout(() => playSound(missSound), 200);
                setTimeout(botTurn, 500);
            }
            renderBoard(enemyBoard, 'enemyBoard', enemyShips, false);
        }

        function botTurn() {
            let row, col;
            do { row = Math.floor(Math.random() * BOARD_SIZE); col = Math.floor(Math.random() * BOARD_SIZE); }
            while (playerBoard[row][col] === 1 || playerBoard[row][col] === 2);
            playSound(shootSound);
            if (playerBoard[row][col] === 3) {
                playerBoard[row][col] = 2;
                const hits = getShipCount(playerBoard, placedShips);
                document.getElementById('status').textContent = 'Opponent hit! His turn again';
                setTimeout(() => playSound(hitSound), 200);
                if (hits >= 20) {
                    document.getElementById('status').innerHTML = '<span class="winner">ПОРАЖЕНИЕ 😢</span>';
                    setTimeout(() => showGameOverPopup(false), 500);
                }
            } else {
                playerBoard[row][col] = 1;
                document.getElementById('status').textContent = 'Opponent missed. Your turn';
                setTimeout(() => playSound(missSound), 200);
            }
            renderBoard(playerBoard, 'playerBoardGame', placedShips, true);
        }

        function checkWin(board, ships) {
            for (const ship of ships) {
                for (let i = 0; i < ship.size; i++) {
                    const r = ship.horizontal ? ship.row : ship.row + i;
                    const c = ship.horizontal ? ship.col + i : ship.col;
                    if (board[r][c] !== 2) return false;
                }
            }
            return true;
        }

        function getShipCount(board, ships) {
            let hitCount = 0;
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 2) hitCount++;
                }
            }
            return hitCount;
        }

        function showGameOverPopup(won) {
            const popup = document.getElementById('gameOverPopup');
            const title = document.getElementById('gameOverTitle');
            const message = document.getElementById('gameOverMessage');
            
            if (won) {
                title.textContent = 'ПОБЕДА! 🎉';
                message.textContent = 'Вы уничтожили все корабли противника!';
                playSound(winSound);
            } else {
                title.textContent = 'ПОРАЖЕНИЕ 😢';
                message.textContent = 'Ваш флот был уничтожен!';
                playSound(loseSound);
            }
            
            popup.style.display = 'flex';
            bgMusic.pause();
        }

        function restartGame() {
            document.getElementById('gameOverPopup').style.display = 'none';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('setup').classList.add('active');
            initSetupBoard();
        }

        function createRoom() {
            connectWS(() => ws.send(JSON.stringify({ type: 'create' })));
        }

        function refreshRooms() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'getRooms' }));
            }
        }

        function joinRoom(code) {
            connectWS(() => ws.send(JSON.stringify({ type: 'join', roomCode: code })));
        }
    </script>
</body>
</html>
