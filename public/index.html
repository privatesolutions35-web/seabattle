<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской бой</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2.5em; text-shadow: 0 0 20px rgba(0, 150, 255, 0.5); }
        .mode-select { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .mode-btn {
            padding: 15px 40px; font-size: 1.2em; border: 2px solid #00d4ff;
            background: transparent; color: #00d4ff; cursor: pointer;
            border-radius: 10px; transition: all 0.3s;
        }
        .mode-btn:hover, .mode-btn.active {
            background: #00d4ff; color: #1a1a2e; box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }
        .game-area { display: none; gap: 50px; justify-content: center; flex-wrap: wrap; }
        .game-area.active { display: flex; }
        .board-container { text-align: center; }
        .board-title { font-size: 1.3em; margin-bottom: 15px; color: #00d4ff; }
        .board {
            display: grid; grid-template-columns: repeat(10, 35px); grid-template-rows: repeat(10, 35px);
            gap: 2px; background: rgba(0, 212, 255, 0.2); padding: 5px; border-radius: 10px;
        }
        .cell {
            width: 35px; height: 35px; background: rgba(0, 50, 100, 0.5);
            border: 1px solid rgba(0, 150, 255, 0.3); cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .cell:hover:not(.hit):not(.miss):not(.ship-placed) { background: rgba(0, 150, 255, 0.3); }
        .cell.ship { background: rgba(100, 100, 100, 0.5); }
        .cell.hit { background: #ff4444; cursor: not-allowed; }
        .cell.miss { background: #444; cursor: not-allowed; }
        .cell.hit::after { content: "✕"; }
        .cell.miss::after { content: "•"; color: #00d4ff; }
        .cell.ship-hit { background: #ff0000; }
        .status { text-align: center; font-size: 1.5em; margin: 20px 0; padding: 15px; background: rgba(0, 212, 255, 0.1); border-radius: 10px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .btn {
            padding: 12px 30px; font-size: 1em; border: none;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #1a1a2e; cursor: pointer; border-radius: 8px; transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .ship-selector { display: none; text-align: center; margin: 20px 0; }
        .ship-selector.active { display: block; }
        .ship-btn {
            padding: 10px 20px; margin: 5px; border: 2px solid #00d4ff;
            background: transparent; color: #00d4ff; cursor: pointer; border-radius: 5px; font-size: 0.9em;
        }
        .ship-btn.selected { background: #00d4ff; color: #1a1a2e; }
        .lobby { display: none; text-align: center; padding: 30px; }
        .lobby.active { display: block; }
        .lobby input {
            padding: 10px 20px; font-size: 1em; border: 2px solid #00d4ff;
            background: transparent; color: #fff; border-radius: 5px; margin: 5px;
        }
        .room-code { font-size: 2em; color: #00d4ff; margin: 20px 0; }
        .waiting { font-size: 1.2em; color: #888; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .winner { animation: fadeIn 0.5s; color: #00ff88; font-size: 2em; }
        .player-num { color: #00ff88; }
        .room-list { margin: 20px 0; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        .room-item {
            padding: 10px; margin: 5px 0; background: rgba(0, 212, 255, 0.1);
            border-radius: 5px; display: flex; justify-content: space-between; align-items: center;
        }
        .room-item button { padding: 5px 15px; font-size: 0.9em; }
        .setup-area { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
        .setup-controls { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚢 Морской бой <span id="onlineCount" style="font-size: 0.5em; color: #00ff88;">Игроков онлайн: 0</span></h1>
        <div class="mode-select">
            <button class="mode-btn" id="btnBot" onclick="selectMode('bot')">Игра с ботом</button>
            <button class="mode-btn" id="btnMulti" onclick="selectMode('multi')">Мультиплеер</button>
        </div>
        <div id="status" class="status">Выберите режим игры</div>
        
        <div id="setup" class="ship-selector">
            <h3>Расставьте корабли</h3>
            <div class="setup-area">
                <div class="board-container">
                    <div class="board-title">Ваше поле</div>
                    <div class="board" id="playerBoard"></div>
                </div>
                <div class="setup-controls">
                    <div class="controls">
                        <button class="ship-btn" data-size="4" onclick="selectShipSize(4)">Авианосец (4)</button>
                        <button class="ship-btn" data-size="3" onclick="selectShipSize(3)">Крейсер (3)</button>
                        <button class="ship-btn" data-size="3" onclick="selectShipSize(3)">Крейсер (3)</button>
                        <button class="ship-btn" data-size="2" onclick="selectShipSize(2)">Эсминец (2)</button>
                        <button class="ship-btn" data-size="2" onclick="selectShipSize(2)">Эсминец (2)</button>
                        <button class="ship-btn" data-size="2" onclick="selectShipSize(2)">Эсминец (2)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">Подводная лодка (1)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">Подводная лодка (1)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">Подводная лодка (1)</button>
                        <button class="ship-btn" data-size="1" onclick="selectShipSize(1)">Подводная лодка (1)</button>
                    </div>
                    <div class="controls">
                        <button class="btn" onclick="rotateShip()">Повернуть (горизонтально)</button>
                        <button class="btn" onclick="randomPlace()">Случайная расстановка</button>
                        <button class="btn" onclick="clearBoard()">Очистить</button>
                    </div>
                    <button class="btn" id="startGameBtn" onclick="startGame()">Начать игру</button>
                </div>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="board-container">
                <div class="board-title">Ваш флот <span id="playerLabel"></span></div>
                <div class="board" id="playerBoardGame"></div>
            </div>
            <div class="board-container">
                <div class="board-title">Вражеский флот</div>
                <div class="board" id="enemyBoard"></div>
            </div>
        </div>

        <div class="lobby" id="lobby">
            <h3>Мультиплеер</h3>
            <div class="controls">
                <button class="btn" onclick="createRoom()">Создать комнату</button>
                <button class="btn" onclick="refreshRooms()">Обновить список</button>
            </div>
            <h4>Доступные комнаты:</h4>
            <div class="room-list" id="roomList">
                <div class="waiting">Загрузка...</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="restartBtn" onclick="restartGame()" style="display:none">Новая игра</button>
        </div>
    </div>
    <script>
        const BOARD_SIZE = 10;
        let playerBoard = [], enemyBoard = [];
        let playerShips = [], enemyShips = [];
        let currentShipSize = 4, isHorizontal = true;
        let gameMode = '', placedShips = [];
        let ws = null, playerId = null, roomCode = null, playerNum = 0;
        let myTurn = true, multiEnemyShips = [];

        function connectWS(callback) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (callback) callback();
                return;
            }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'getOnline' }));
                document.getElementById('status').textContent = 'Подключено. Выберите режим игры';
                if (callback) callback();
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handleWSMessage(msg);
            };
            ws.onerror = (e) => {
                console.log('WebSocket error:', e);
            };
        }

        function handleWSMessage(msg) {
            switch (msg.type) {
                case 'onlineCount':
                    document.getElementById('onlineCount').textContent = `Игроков онлайн: ${msg.count}`;
                    break;
                case 'roomsList':
                    renderRoomList(msg.rooms);
                    break;
                case 'created':
                    roomCode = msg.roomCode;
                    playerId = msg.playerId;
                    playerNum = 1;
                    document.getElementById('status').textContent = `Комната создана: ${roomCode}. Ожидание игрока...`;
                    break;
                case 'joined':
                    roomCode = msg.roomCode;
                    playerId = msg.playerId;
                    playerNum = 2;
                    document.getElementById('status').textContent = 'Вы присоединились к комнате';
                    startMultiSetup();
                    break;
                case 'playerJoined':
                    document.getElementById('status').textContent = 'Игрок присоединился! Расставьте корабли';
                    startMultiSetup();
                    break;
                case 'playerReady':
                    document.getElementById('status').textContent = 'Противник расставляет корабли...';
                    break;
                case 'start':
                    myTurn = msg.currentPlayer === playerId;
                    document.getElementById('setup').classList.remove('active');
                    document.getElementById('gameArea').classList.add('active');
                    document.getElementById('lobby').classList.remove('active');
                    document.getElementById('playerLabel').innerHTML = playerNum === 1 ? '(Игрок 1)' : '(Игрок 2)';
                    updateTurnStatus();
                    break;
                case 'shotResult':
                    if (msg.playerId === playerId) {
                        const cell = document.querySelector(`#enemyBoard .cell[data-row="${msg.row}"][data-col="${msg.col}"]`);
                        if (cell) cell.classList.add(msg.result === 'hit' || msg.result === 'sunk' ? 'hit' : 'miss');
                    } else {
                        const cell = document.querySelector(`#playerBoardGame .cell[data-row="${msg.row}"][data-col="${msg.col}"]`);
                        if (cell) {
                            cell.classList.add(msg.result === 'hit' || msg.result === 'sunk' ? 'hit' : 'miss');
                            cell.classList.add('ship');
                        }
                    }
                    break;
                case 'nextTurn':
                    myTurn = msg.playerId === playerId;
                    updateTurnStatus();
                    break;
                case 'gameOver':
                    const won = msg.winner === playerId;
                    document.getElementById('status').innerHTML = won ? '<span class="winner">ПОБЕДА! 🎉</span>' : '<span class="winner">ПОРАЖЕНИЕ 😢</span>';
                    document.getElementById('restartBtn').style.display = 'block';
                    break;
                case 'opponentLeft':
                    alert('Противчик вышел из игры');
                    location.reload();
                    break;
                case 'error':
                    alert(msg.message);
                    break;
            }
        }

        function renderRoomList(rooms) {
            const list = document.getElementById('roomList');
            if (!rooms || rooms.length === 0) {
                list.innerHTML = '<div class="waiting">Нет доступных комнат</div>';
                return;
            }
            list.innerHTML = rooms.map(r => `
                <div class="room-item">
                    <span>Комната: ${r.code} (${r.players}/2 игроков)</span>
                    <button class="btn" onclick="joinRoom('${r.code}')">Войти</button>
                </div>
            `).join('');
        }

        function updateTurnStatus() {
            document.getElementById('status').textContent = myTurn ? 'Ваш ход' : 'Ход противника';
        }

        function initBoard() { return Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0)); }

        function renderBoard(board, elementId, ships = [], showShips = false) {
            const boardEl = document.getElementById(elementId);
            boardEl.innerHTML = '';
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    const ship = ships.find(s => i >= s.row && i < s.row + s.size && j >= s.col && j < s.col + s.size);
                    if (showShips && ship) cell.classList.add('ship');
                    if (board[i][j] === 1) cell.classList.add('miss');
                    if (board[i][j] === 2) cell.classList.add('hit');
                    if (board[i][j] === 3 && showShips) cell.classList.add('ship-hit');
                    if (elementId === 'enemyBoard') {
                        if (gameMode === 'multi' && myTurn) {
                            cell.onclick = () => multiShoot(i, j);
                        } else if (gameMode === 'bot') {
                            cell.onclick = () => playerShoot(i, j);
                        }
                    }
                    boardEl.appendChild(cell);
                }
            }
        }

        function selectMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('setup').classList.remove('active');
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('lobby').classList.remove('active');
            document.getElementById('status').textContent = 'Выберите режим игры';
            
            if (mode === 'bot') {
                document.getElementById('setup').classList.add('active');
                initSetupBoard();
            } else {
                document.getElementById('lobby').classList.add('active');
                connectWS(refreshRooms);
            }
        }

        function initSetupBoard() {
            playerBoard = initBoard();
            placedShips = [];
            document.querySelectorAll('.ship-btn').forEach(b => { b.classList.remove('placed'); b.style.display = 'inline-block'; });
            currentShipSize = 4;
            selectShipSize(4);
            renderPlayerSetup();
        }

        function renderPlayerSetup() {
            const boardEl = document.getElementById('playerBoard');
            boardEl.innerHTML = '';
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    if (playerBoard[i][j] === 3) cell.classList.add('ship');
                    cell.onclick = () => placeShip(i, j);
                    boardEl.appendChild(cell);
                }
            }
        }

        function selectShipSize(size) {
            currentShipSize = size;
            document.querySelectorAll('.ship-btn').forEach(b => b.classList.remove('selected'));
            document.querySelector(`.ship-btn[data-size="${size}"]:not(.placed)`)?.classList.add('selected');
        }

        function rotateShip() {
            isHorizontal = !isHorizontal;
            document.querySelector('.btn[onclick="rotateShip()"]').textContent = `Повернуть (${isHorizontal ? 'горизонтально' : 'вертикально'})`;
        }

        function placeShip(row, col) {
            if (canPlaceShip(row, col, currentShipSize, isHorizontal)) {
                for (let i = 0; i < currentShipSize; i++) {
                    const r = isHorizontal ? row : row + i;
                    const c = isHorizontal ? col + i : col;
                    playerBoard[r][c] = 3;
                }
                placedShips.push({ row, col, size: currentShipSize, horizontal: isHorizontal });
                renderPlayerSetup();
                hidePlacedShip();
            }
        }

        function hidePlacedShip() {
            const btns = document.querySelectorAll('.ship-btn:not(.placed)');
            if (btns.length > 0) {
                btns[0].classList.add('placed');
                btns[0].style.display = 'none';
                if (btns[1]) selectShipSize(parseInt(btns[1].dataset.size));
            }
        }

        function canPlaceShip(row, col, size, horizontal) {
            for (let i = 0; i < size; i++) {
                const r = horizontal ? row : row + i;
                const c = horizontal ? col + i : col;
                if (r >= BOARD_SIZE || c >= BOARD_SIZE) return false;
                if (playerBoard[r][c] !== 0) return false;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            if (playerBoard[nr][nc] !== 0 && playerBoard[nr][nc] !== 3) return false;
                        }
                    }
                }
            }
            return true;
        }

        function randomPlace() {
            playerBoard = initBoard();
            placedShips = [];
            const ships = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
            for (const size of ships) {
                let placed = false;
                while (!placed) {
                    const horizontal = Math.random() > 0.5;
                    const row = Math.floor(Math.random() * BOARD_SIZE);
                    const col = Math.floor(Math.random() * BOARD_SIZE);
                    if (canPlaceOnBoard(row, col, size, horizontal, playerBoard)) {
                        for (let i = 0; i < size; i++) {
                            const r = horizontal ? row : row + i;
                            const c = horizontal ? col + i : col;
                            playerBoard[r][c] = 3;
                        }
                        placedShips.push({ row, col, size, horizontal });
                        placed = true;
                    }
                }
            }
            document.querySelectorAll('.ship-btn').forEach(b => { b.classList.add('placed'); b.style.display = 'none'; });
            renderPlayerSetup();
        }

        function clearBoard() {
            initSetupBoard();
        }

        function canPlaceOnBoard(row, col, size, horizontal, board) {
            for (let i = 0; i < size; i++) {
                const r = horizontal ? row : row + i;
                const c = horizontal ? col + i : col;
                if (r >= BOARD_SIZE || c >= BOARD_SIZE) return false;
                if (board[r][c] !== 0) return false;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            if (board[nr][nc] !== 0) return false;
                        }
                    }
                }
            }
            return true;
        }

        function startGame() {
            if (placedShips.length < 10) { alert('Расставьте все корабли!'); return; }
            if (gameMode === 'bot') startBotGame();
            else sendReady();
        }

        function startBotGame() {
            document.getElementById('setup').classList.remove('active');
            document.getElementById('gameArea').classList.add('active');
            enemyBoard = initBoard();
            placeEnemyShips();
            document.getElementById('status').textContent = 'Ваш ход';
            renderBoard(playerBoard, 'playerBoardGame', placedShips, true);
            renderBoard(enemyBoard, 'enemyBoard', enemyShips, false);
            
            // Добавляем обработчики клика для стрельбы в режиме бота
            const enemyCells = document.querySelectorAll('#enemyBoard .cell');
            enemyCells.forEach(cell => {
                cell.onclick = () => {
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    playerShoot(row, col);
                };
            });
        }

        function startMultiSetup() {
            document.getElementById('lobby').classList.remove('active');
            document.getElementById('setup').classList.add('active');
            initSetupBoard();
            document.getElementById('startGameBtn').textContent = 'Я готов!';
            document.getElementById('status').textContent = `Расставьте корабли (Игрок ${playerNum})`;
        }

        function sendReady() {
            ws.send(JSON.stringify({ type: 'ready', board: playerBoard, ships: placedShips }));
            document.getElementById('status').textContent = 'Ожидаем противника...';
            document.getElementById('startGameBtn').disabled = true;
        }

        function multiShoot(row, col) {
            if (!myTurn) return;
            if (enemyBoard[row][col] === 1 || enemyBoard[row][col] === 2) return;
            ws.send(JSON.stringify({ type: 'shoot', row, col }));
        }

        function placeEnemyShips() {
            enemyShips = [];
            const ships = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
            for (const size of ships) {
                let placed = false;
                while (!placed) {
                    const horizontal = Math.random() > 0.5;
                    const row = Math.floor(Math.random() * BOARD_SIZE);
                    const col = Math.floor(Math.random() * BOARD_SIZE);
                    if (canPlaceOnBoard(row, col, size, horizontal, enemyBoard)) {
                        for (let i = 0; i < size; i++) {
                            const r = horizontal ? row : row + i;
                            const c = horizontal ? col + i : col;
                            enemyBoard[r][c] = 3;
                        }
                        enemyShips.push({ row, col, size, horizontal });
                        placed = true;
                    }
                }
            }
        }

        function playerShoot(row, col) {
            if (enemyBoard[row][col] === 1 || enemyBoard[row][col] === 2) return;
            if (enemyBoard[row][col] === 3) {
                enemyBoard[row][col] = 2;
                const hits = getShipCount(enemyBoard, enemyShips);
                document.getElementById('status').textContent = 'Попал! Стреляйте снова';
                if (hits === 20) {
                    document.getElementById('status').innerHTML = '<span class="winner">ПОБЕДА! 🎉</span>';
                    document.getElementById('restartBtn').style.display = 'block';
                }
            } else {
                enemyBoard[row][col] = 1;
                document.getElementById('status').textContent = 'Промах. Ход противника';
                setTimeout(botTurn, 500);
            }
            renderBoard(enemyBoard, 'enemyBoard', enemyShips, false);
        }

        function botTurn() {
            let row, col;
            do { row = Math.floor(Math.random() * BOARD_SIZE); col = Math.floor(Math.random() * BOARD_SIZE); }
            while (playerBoard[row][col] === 1 || playerBoard[row][col] === 2);
            if (playerBoard[row][col] === 3) {
                playerBoard[row][col] = 2;
                const hits = getShipCount(playerBoard, placedShips);
                document.getElementById('status').textContent = 'Противник попал! Его ход снова';
                if (hits === 20) {
                    document.getElementById('status').innerHTML = '<span class="winner">ПОРАЖЕНИЕ 😢</span>';
                    document.getElementById('restartBtn').style.display = 'block';
                }
            } else {
                playerBoard[row][col] = 1;
                document.getElementById('status').textContent = 'Противник промахнулся. Ваш ход';
            }
            renderBoard(playerBoard, 'playerBoardGame', placedShips, true);
        }

        function checkWin(board, ships) {
            for (const ship of ships) {
                for (let i = 0; i < ship.size; i++) {
                    const r = ship.horizontal ? ship.row : ship.row + i;
                    const c = ship.horizontal ? ship.col + i : ship.col;
                    if (board[r][c] !== 2) return false;
                }
            }
            return true;
        }

        function getShipCount(board, ships) {
            let hitCount = 0;
            for (const ship of ships) {
                for (let i = 0; i < ship.size; i++) {
                    const r = ship.horizontal ? ship.row : ship.row + i;
                    const c = ship.horizontal ? ship.col + i : ship.col;
                    if (board[r][c] === 2) hitCount++;
                }
            }
            return hitCount;
        }

        function restartGame() {
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('setup').classList.add('active');
            initSetupBoard();
        }

        function createRoom() {
            connectWS(() => ws.send(JSON.stringify({ type: 'create' })));
        }

        function refreshRooms() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'getRooms' }));
            }
        }

        function joinRoom(code) {
            connectWS(() => ws.send(JSON.stringify({ type: 'join', roomCode: code })));
        }
    </script>
</body>
</html>
